esphome:
  name: ir-transmitter
  friendly_name: IR Transmitter

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

logger:

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

# Illustrative NEC codes; replace with captured codes.
button:
  - platform: template
    name: "Power"
    icon: "mdi:power"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xFF00
          command: 0xEF10
  - platform: template
    name: "Volume Up"
    icon: "mdi:volume-plus"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xFF00
          command: 0xEE11
  - platform: template
    name: "Volume Down"
    icon: "mdi:volume-minus"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0xFF00
          command: 0xED12
